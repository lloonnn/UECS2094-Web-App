<!DOCTYPE html>
<html>
    <head>
        <style>
            table{
                border-collapse: collapse;
                margin: auto;
                background-color: white;
            }

            caption{
                caption-side: top;
                font-style: italic;
                font-size: 20px;
                margin-bottom: 10px;
            }

            th, td{
                border: 1px solid #ccc;
                padding: 10px;
                text-align: center;
            }

            th{
                background-color: red;
                color: white;
            }

            tbody{
                color: black;
            }

            tbody tr:nth-child(odd){
                background-color: white;
            }

            tbody tr:nth-child(even){
                background-color: lightgray;
            }

            tbody tr:last-child{
                border-bottom: 3px solid red;
            }
        </style>
    </head>

    <body>
        <div id="tableContainer"></div>
        <script>
            var contacts = [
                {name: "Chia Kim Hooi", phone: "+60124044404", email: "chiakh@duck.com", facebook: "xyz.chiakh"},
                {name: "Chan Xiao Hui", phone: "+60125785678", email: "chanxh@pingguo.com", facebook: "pqr.chanxh"},
                {name: "Tan Chin Tiong", phone: "+60193163616", email: "tanct@burungtiong.com", facebook: "abc.tanct"},
                {name: "Foo Yoke Wai", phone: "+60125575552", email: "fooyw@chicken.com", facebook: "ijk.fooyw"},
                {name: "Ho Xin Yi", phone: "+60195889776", email: "hoxy@myna.com", facebook: "mno.hoxy"}
            ];


            let titles = ["No.", "Name", "Phone", "Email", "Facebook"];
            
            function generateTable() {
                // create table element
                let table = document.createElement("table");

                //caption
                let caption = document.createElement("caption");
                caption.textContent = "Contact List";
                table.appendChild(caption);

                // header
                let thead = document.createElement("thead");
                var tr = document.createElement("tr");
                titles.forEach(title=>{
                    let th = document.createElement("th");
                    th.textContent = title;
                    tr.appendChild(th);
                });

                thead.appendChild(tr);
                table.appendChild(thead);

                // body
                let tbody = document.createElement("tbody");
                let i = 1;
                contacts.forEach(contact => {
                    let tr = document.createElement("tr");

                    var td = document.createElement("td");
                    td.textContent = `${i++}.`;
                    tr.appendChild(td);

                    var td = document.createElement("td");
                    td.textContent = contact.name;
                    tr.appendChild(td);

                    var td = document.createElement("td");
                    td.textContent = contact.phone;
                    tr.appendChild(td);

                    var td = document.createElement("td");
                    var a = document.createElement("a");
                    a.setAttribute("href", `mailto:${contact.email}`);
                    a.textContent = contact.email;
                    td.appendChild(a);
                    tr.appendChild(td);

                    var td = document.createElement("td");
                    var a = document.createElement("a");
                    a.setAttribute("href", `https://www.facebook.com/${contact.facebook}`);
                    a.setAttribute("target", "blank");
                    a.textContent = contact.facebook;   
                    td.appendChild(a);                                     
                    tr.appendChild(td);

                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                document.getElementById("tableContainer").appendChild(table);
            };

            window.onload = generateTable;

        </script>
    </body>
</html>
